{{template "base_start" .}}
<div class="page-head"><div><span class="eyebrow">Параметры подбора</span><h1>{{if .IsEdit}}Редактирование вакансии{{else}}Новая вакансия{{end}}</h1></div></div>
<form class="card form-card" method="post"><div class="form-grid">
<label>Название<input name="title" required value="{{if .IsEdit}}{{.Vacancy.Title}}{{end}}"></label><label>Отдел<input name="department" value="{{if .IsEdit}}{{.Vacancy.Department}}{{end}}"></label>
<label>Город<input name="city" required value="{{if .IsEdit}}{{.Vacancy.City}}{{else}}Екатеринбург{{end}}"></label>
<label>Тип занятости<select name="employment_type"><option {{if and .IsEdit (eq .Vacancy.EmploymentType "Полная занятость")}}selected{{end}}>Полная занятость</option><option {{if and .IsEdit (eq .Vacancy.EmploymentType "Удаленно")}}selected{{end}}>Удаленно</option><option {{if and .IsEdit (eq .Vacancy.EmploymentType "Частичная занятость")}}selected{{end}}>Частичная занятость</option></select></label>
<label>Минимальный опыт<input name="min_experience" type="number" step="0.5" value="{{if .IsEdit}}{{.Vacancy.MinExperience}}{{else}}2{{end}}"></label><label>Образование<input name="education_level" value="{{if .IsEdit}}{{.Vacancy.EducationLevel}}{{else}}Высшее{{end}}"></label>
<label>Зарплата от<input name="salary_min" type="number" value="{{if .IsEdit}}{{.Vacancy.SalaryMin}}{{else}}150000{{end}}"></label><label>Зарплата до<input name="salary_max" type="number" value="{{if .IsEdit}}{{.Vacancy.SalaryMax}}{{else}}230000{{end}}"></label>
<label class="span-2">Требуемые навыки<input name="skills" value="{{if .IsEdit}}{{.SkillNames}}{{else}}{{.DefaultSkills}}{{end}}"></label><label class="span-2">Описание<textarea name="description" rows="3">{{if .IsEdit}}{{.Vacancy.Description}}{{end}}</textarea></label><label class="span-2">Требования<textarea name="requirements" rows="3">{{if .IsEdit}}{{.Vacancy.Requirements}}{{end}}</textarea></label>
</div><div class="form-actions"><button class="btn primary">Сохранить</button><a class="btn ghost" href="/vacancies">Отмена</a>{{if .IsEdit}}<button class="btn ghost" type="submit" formaction="/vacancies/{{.Vacancy.ID}}/toggle">{{if .Vacancy.IsActive}}Закрыть{{else}}Открыть{{end}}</button><button class="btn ghost" type="submit" formaction="/vacancies/{{.Vacancy.ID}}/delete" onclick="return confirm('Удалить вакансию?')">Удалить</button>{{end}}</div></form>
{{template "base_end" .}}
