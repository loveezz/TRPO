services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: candidates_db
      POSTGRES_USER: candidate_user
      POSTGRES_PASSWORD: candidate_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidate_user -d candidates_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      APP_PORT: 8000
      DATABASE_DSN: "host=db user=candidate_user password=candidate_pass dbname=candidates_db port=5432 sslmode=disable TimeZone=Asia/Yekaterinburg"
      SESSION_SECRET: "study-secret-change-me"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
